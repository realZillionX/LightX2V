name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Lint all tracked files
        run: pre-commit run --all-files

  rl-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_PLATFORM_CHECK: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install CPU test runtime
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow imageio imageio-ffmpeg einops loguru safetensors pytest packaging
          python -c "import torch; assert torch.version.cuda is None"
      - name: Check Python syntax
        run: python -m compileall -q lightx2v lightx2v_platform tests/rl
      - name: Test RL math, traces, pixel head, and weight publication
        run: python -m pytest -q tests/rl
